<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no, email=no, address=no">   <!-- iOS Safari 會自動把電話／email 變成底線連結（faculty 卡；user 2026-10-31） -->
  <link rel="icon" type="image/webp" href="../images/favicon.webp">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <meta name="robots" content="noindex">
  <title>Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Noto+Sans+TC:wght@400..600&family=Noto+Sans+JP:wght@400..600&family=Noto+Sans+SC:wght@400..600&display=swap">
  <link rel="stylesheet" href="../css/output.css">
  <script src="../js/utils/layout-mode.js"></script>
</head>
<body>

  <!-- Header -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main id="page-content">
    <!-- 404-only 樣式：放 main 內，SPA innerHTML 切換時自動跟著進出（離開頁時隨 innerHTML 替換被移除） -->
    <style>
      /* header 鈕全藏（桌面 mode／menu 都帶 data-bar），只留 logo */
      body.page-404 #site-header header [data-bar],
      body.page-404 #site-header header .mobile-menu-btn,
      body.page-404 .mobile-nav {
        display: none !important;
      }
      /* 手機／iPad 同桌面：鈕的黑底外殼也藏（原本只藏裡面的鈕＝右上角剩一顆空的黑方塊，user 2026-11-12）。
         visibility 不用 display：這列的高是鈕撐的、logo 靠它垂直置中，整顆拿掉 logo 會往上跳 22px */
      body.page-404 #site-header header .mobile-header-btn {
        visibility: hidden !important;
      }

      /* Stage：占整個 viewport 高（100vh），cards 用 absolute % 在此分佈；
         非 fixed，讓後續 footer 可隨 scroll 出現 */
      #error-404-stage {
        position: relative;
        width: 100%;
        height: 100svh;
        overflow: hidden;
        background: var(--theme-bg, #ffffff);
        color: var(--theme-fg, #000000);
      }

      /* Anchor wrapper：負責 abs 定位 + 旋轉 + clip-reveal 遮罩
         - overflow:clip 讓內層 card 做 yPercent:100→0 reveal 時超出邊界被剪
         - inline-block 讓 wrapper 包緊 card content（不撐到 100%）
         - JS 用 gsap.set xPercent:-50 yPercent:-50 居中 + rotation 隨機角度 */
      .error-404-anchor {
        position: absolute;
        top: 0;
        left: 0;
        display: inline-block;
        overflow: clip;
        text-decoration: none;
        transform-origin: center center;
      }

      /* Card 本體：bg / padding / 文字；padding 用 rem（對齊 hero [data-hero-hl] 規格，
         避免 h1 8rem 字時 em padding 等比放大成過大色塊）*/
      .error-404-card {
        display: block;
        margin: 0;
        padding: var(--card-pad-3xl);   /* 字級 3xl 的字卡內距（variables.css） */
        line-height: var(--line-height-3xl);
        color: var(--color-black);
        white-space: nowrap;
        user-select: none;
      }
      [data-error-card="weizhi"] .error-404-card {   /* 純中文大字卡墨跡補償（variables.css --zh-ink-nudge）：--card-pad-3xl 上下是 0、上內距減不下去 → 補償全給下內距（2×＝上挪 1× 同效） */
        padding-top: 0;
        padding-bottom: calc(2 * var(--zh-ink-nudge));
      }

      /* 回首頁鈕：固定左下、不參與隨機排位（user 2026-11-17）；位置鏡像右下 footer 鈕（左＝container padding、底與尺寸同它：
         真桌面 48／底 48，其餘 44／貼底界線）。外層 overflow:clip＝進退場遮罩（形狀＝鈕本身） */
      .error-404-back {
        position: fixed;
        left: var(--container-padding);
        bottom: 48px;
        z-index: 50;
        width: 48px;
        height: 48px;
        overflow: clip;
        text-decoration: none;
      }
      .error-404-back-inner {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: var(--theme-fg);
        color: var(--theme-fg-inverse);
        font-size: 32px;
      }
      @media not all and (orientation: landscape) and (min-width: 1024px) and (min-height: 501px) and (hover: hover) {
        .error-404-back { bottom: var(--mobile-bottom-anchor); width: 44px; height: 44px; }
        .error-404-back-inner { font-size: 28px; }
      }

      /* hover：預設黑方塊、hover＝標題卡的顏色（error-404.js bindNavBtnHover pick 固定回標題色）黑 icon；瞬切不 fade。
         mode3 標題卡本身是 theme-fg（同鈕預設）→ 照黑方塊鈕家族翻反色 */
      @media (hover: hover) and (min-width: 768px) {
        body:not(.mode-color) .error-404-back[data-nav-hover]:hover .error-404-back-inner { background-color: var(--nav-hover); color: var(--color-black); }
        body.mode-color .error-404-back[data-nav-hover]:hover .error-404-back-inner { background-color: var(--theme-fg-inverse); color: var(--theme-fg); }
      }

      /* mode-color：bg 用 var(--theme-fg) = 純 #000 或 #fff（依 vivid hue WCAG luminance 決定），
         text 用 var(--theme-fg-inverse) = 相反純色 → 黑底白字 / 白底黑字 對比最強；
         !important 蓋 JS init404 對 card 設的 inline backgroundColor */
      body.mode-color .error-404-card {
        background-color: var(--theme-fg) !important;
        color: var(--theme-fg-inverse) !important;
      }
    </style>

    <section id="error-404-stage">
      <div class="error-404-anchor" data-error-card="error">
        <!-- 兩張大字卡＝後台 ui_labels error.title 的英／中（這裡的字＝後台掛時的 fallback） -->
        <h1 class="error-404-card is-huge" data-label-key="error.title">ERROR</h1>
      </div>
      <div class="error-404-anchor" data-error-card="weizhi">
        <h1 class="error-404-card is-huge" data-label-key="error.title" data-label-part="zh">未知</h1>
      </div>
    </section>
    <!-- 回首頁鈕在 stage 外：fixed 左下、不吃隨機排位與 5s 重排。不帶 icon-* size class＝icon 繼承 inner 字級 -->
    <a href="../index.html" class="error-404-back" aria-label="Back to Home 回首頁">
      <span class="error-404-back-inner">
        <span class="icon icon-arrow-left"></span>
      </span>
    </a>
  </main>

  <!-- Footer -->
  <div id="site-footer"></div>

  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollToPlugin.min.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script type="module" src="../js/main-modular.js"></script>

</body>
</html>
