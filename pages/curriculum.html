<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum - SCCD</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>

  <!-- Header -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main id="page-content">

    <!-- Courses Hero Section
         桌面 .hero-rand-grid：4 元素隨機 corner 排版（hero-animation.js）
         手機 .hero-mobile：圖墊底 + 文字 stack 疊在圖上（hero-mobile-sync.js 從桌面 clone） -->
    <section class="snap-zone min-h-screen md:h-screen relative overflow-x-clip md:overflow-hidden">
      <!-- 手機版 -->
      <div class="hero-mobile">
        <div class="hero-mobile-bg">
          <img src="" alt="">
        </div>
        <div class="hero-mobile-text">
          <h1 class="text-black hero-mobile-title" data-hero-hl></h1>
          <h1 class="text-black hero-mobile-title-cn" data-hero-hl></h1>
          <p class="text-black hero-mobile-text-en" data-hero-hl></p>
          <p class="text-black hero-mobile-text-cn" data-hero-hl></p>
        </div>
      </div>
      <!-- 桌面版 -->
      <div class="hero-rand-grid">
        <h1 class="text-black hero-title inline-block" data-hero-hl>CURRICULUM</h1>
        <h1 class="text-black hero-title-cn inline-block" data-hero-hl>課程</h1>
        <div class="hero-banner">
          <img src="../images/SCCD-1-4-0.jpg" alt="Courses">
        </div>
        <p class="text-black hero-text-en" data-hero-hl>
          Explore our undergraduate and graduate programs designed to nurture creativity and communication skills in media design.
        </p>
        <p class="text-black hero-text-cn" data-hero-hl>
          探索學士班與碩士班課程，培育媒體傳達設計領域的創意與專業能力。
        </p>
      </div>
    </section>

    <!-- Courses Content Section
         Layout（桌面）：左 program bar (vertical sticky) ｜ 中 grid panels ｜ 右 sticky desc panel
                Mobile：垂直堆疊（bar → panels → desc 隱藏）
    -->
    <!-- 手機 pt-4xl(80)：四頁 nav btn section 統一（faculty/activities/admission/curriculum，user 2026-07-10 從 6xl 收上來） -->
    <section class="snap-zone bg-white min-h-screen pt-4xl pb-2xl md:pt-0 md:pb-0 md:h-screen md:overflow-hidden" id="courses-content-section">
      <div class="site-container">
        <!-- grid-20：桌面 program bar 占 cols 1-4、課程內容 cols 5-20（對齊 faculty/about col-5）；手機 flex-col 堆疊 -->
        <div class="courses-content-row flex flex-col gap-gutter md:grid md:grid-cols-20 inner-scroll-frame-grid">

          <!-- Left column: program btn bar（桌面 cols 1-4；mobile 直接 flex-col 自然流）
               桌面 inner-scroll frame：外層 nav-col wrapper（占 col-span-4）padding-top 把 bar 推到 content 區頂、頂部對齊；
               bar 不再 col-span-4、courses.css frame 規則把 bar 的 position:sticky 改回 static（見 courses.css）。 -->
          <div class="md:col-span-4 inner-scroll-nav-col">
          <div class="courses-program-bar flex flex-col items-start gap-lg md:gap-2xl mb-md md:mb-0">
            <div class="courses-program-group flex flex-col items-start gap-xs">
              <span class="courses-bfa-label"><span data-label-key="curriculum.group.bfa" data-label-part="en">BFA</span><span data-label-key="curriculum.group.bfa" data-label-part="zh">學士班</span></span>
              <button class="courses-program-btn active" data-program="bfa-animation">
                <!-- br 後的空格：br 顯示時被行首 collapse（零視覺差）；橫向 gate 藏 br 後成為單行的字間空格。
                     ⚠️ ui_labels 填入後 br 消失（textContent）→ 靠容器寬度自然換行 -->
                <span class="anchor-nav-inner"><span data-label-key="curriculum.program.animation" data-label-part="en">Animation &amp; Moving<br> Image</span><span data-label-key="curriculum.program.animation" data-label-part="zh">動畫影像設計組</span></span>
              </button>
            </div>
            <div class="courses-program-group flex flex-col items-start gap-xs">
              <span class="courses-bfa-label"><span data-label-key="curriculum.group.bfa" data-label-part="en">BFA</span><span data-label-key="curriculum.group.bfa" data-label-part="zh">學士班</span></span>
              <button class="courses-program-btn" data-program="bfa-cmd">
                <span class="anchor-nav-inner"><span data-label-key="curriculum.program.creative-media" data-label-part="en">Creative Media Design</span><span data-label-key="curriculum.program.creative-media" data-label-part="zh">創意媒體設計組</span></span>
              </button>
            </div>
            <button class="courses-program-btn" data-program="mdes">
              <span class="anchor-nav-inner"><span data-label-key="curriculum.program.mdes" data-label-part="en">MDES</span><span data-label-key="curriculum.program.mdes" data-label-part="zh">碩士班</span></span>
            </button>
          </div>
          </div>

          <!-- Middle column: 三個 program panel（grid 由 JS 渲染）；桌面占 cols 5-20、桌面 inner-scroll = 唯一捲動的 box -->
          <div class="min-w-0 md:col-start-5 md:col-span-16 inner-scroll-scroll-col no-scrollbar">
            <div class="courses-panel" id="panel-bfa-animation">
              <div class="courses-grid"></div>
            </div>
            <div class="courses-panel hidden" id="panel-bfa-cmd">
              <div class="courses-grid"></div>
            </div>
            <div class="courses-panel hidden" id="panel-mdes">
              <div class="courses-grid"></div>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- Course Detail Slide-in Modal（仿 #faculty-slide-in pattern）
         click 卡片 → 從右滑入；overlay/close-btn/Esc 關閉；body.overflow lock 鎖捲動
         手機：頂部留 header 高度避讓 logo + mode + menu；返回鍵在 panel 內 flow 最上方，title 接著返回鍵
         z-[10001]：高於 header lightbox-raise(10000)，免收合動畫中的 header bars 蓋住 slide-in（user 2026-08-31） -->
    <div id="courses-slide-in" class="invisible pointer-events-none fixed inset-0 z-[10001]">
      <div id="courses-overlay" class="absolute inset-0 bg-black opacity-0 cursor-pointer"></div>
      <!-- title 區 sticky 在頂端不動；desc 包進固定 wrapper，內部 overflow-y 自己 scroll（參考 activities list-scroll pattern） -->
      <div id="courses-detail-panel" role="dialog" aria-modal="true" aria-labelledby="courses-detail-title-en courses-detail-title-zh" tabindex="-1" class="absolute right-0 top-0 bottom-0 w-full md:w-[40%] overflow-hidden"
           style="background: white; transform: translateX(110%);">
        <!-- 手機返回鍵：釘在 header 右側 menu 鈕位（同 faculty slide-in，.faculty-back-header 佈局在 cards.css）；
             關閉走 courses-map.js 的 document 級 delegation（比對 #courses-back-btn-mobile） -->
        <button id="courses-back-btn-mobile" class="md:hidden faculty-back-header cursor-pointer bg-transparent" aria-label="返回">
          <span class="icon icon-arrow-right text-black icon-m"></span>
        </button>
        <!-- 桌面（仿 faculty slide-in 右欄）：inner md:overflow-hidden 不捲，title 固定在上、desc 在獨立 .list-scroll box 內捲動 → 右側細黑 scrollbar。
             手機：inner overflow-y-auto 整段捲、title sticky 黏頂（見 .courses-detail-title-sticky）。
             pb 改放捲動內容內部（desc-wrapper）：容器不留 pb、捲到底最後一行才不貼底邊（user 2026-08-07） -->
        <!-- overscroll-y-contain：手機捲到頂/底時不 chain 到背後 body（同 faculty slide-in；iOS momentum non-cancelable、JS lock 擋不到，靠原生 overscroll-behavior 阻斷） -->
        <!-- 桌面：pt/間距收在 wrapper（md:pt-4xl 同 faculty container、md:gap-lg=2rem title↔desc 距），title 不自帶 padding；
             手機/矮橫向不動（title 自帶 pt/pb 是 sticky 遮罩的一部分，見 courses.css / landscape.css counter-override） -->
        <div class="courses-detail-inner w-full h-full px-container-padding md:pt-4xl flex flex-col md:gap-lg overflow-y-auto md:overflow-hidden overscroll-y-contain no-scrollbar bg-inherit">
          <!-- title 區：桌面固定（flex-shrink:0，不捲）；手機 sticky 黏頂 -->
          <div class="courses-detail-title-sticky">
            <h2 id="courses-detail-title-en" class="courses-detail-title-en text-xl font-bold mb-en-zh-xl"></h2>
            <h2 id="courses-detail-title-zh" class="courses-detail-title-zh text-xl font-bold mb-0" lang="zh-Hant"></h2>
          </div>
          <!-- desc：桌面成獨立 scroll box（md:flex-1 撐滿剩餘高 + md:overflow-y-auto + list-scroll 細黑 scrollbar + md:pr-md 留 scrollbar 間距），手機隨 inner 整段捲 -->
          <div class="courses-detail-desc-wrapper md:flex-1 md:min-h-0 md:overflow-y-auto list-scroll md:pr-md pb-[var(--container-padding)] md:pb-2xl">
            <p id="courses-detail-desc-en" class="courses-detail-desc-en text-s mb-en-zh-body"></p>
            <p id="courses-detail-desc-zh" class="courses-detail-desc-zh text-s" lang="zh-Hant"></p>
          </div>
        </div>
      </div>
      <!-- 桌面返回鍵：黑方塊立在 panel 左側空白區正中、貼底、隨機旋轉（JS 套 transform）；關閉走 courses-map.js delegation。
           手機/矮橫向用 panel 內右上 #courses-back-btn-mobile；--slide-panel-w = panel 寬（md:w-[40%]）供置中計算 -->
      <button id="courses-back-btn-desktop" aria-label="返回 Back" class="slide-in-back-square cursor-pointer" style="--slide-panel-w: 40%;">
        <span class="slide-in-back-square-inner">
          <span class="icon icon-arrow-left text-white icon-l"></span>
        </span>
      </button>
    </div>
  </main>

  <!-- Footer -->
  <div id="site-footer" class="snap-zone"></div>

  <!-- JavaScript -->
  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollToPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/Draggable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/InertiaPlugin.min.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script type="module" src="../js/main-modular.js"></script>

</body>
</html>
