<header class="fixed top-0 left-0 right-0 z-50">
  <!-- 無障礙 Phase 1：鍵盤 Tab 第一站，跳過導航直達主內容（#page-content 跨 SPA 換頁恆在） -->
  <a href="#page-content" class="skip-link">跳到主要內容 Skip to content</a>
  <div class="site-container">
    <!-- 桌面版：整排 flex，items-start＝logo 與 mode/menu 鈕頂對齊（pt 48）。
         h-24 固定 96：logo（180/100）in-flow 但溢出列底，不撐高 header（--header-height 全站版面在用） -->
    <div class="hidden md:flex items-start pt-[3rem] h-24 relative z-50">

      <!-- Logo（2026-09-27 由 absolute -top-4 改 in-flow）：relative＝/create typewriter 的 absolute SCCD svg/cursor 定位框 -->
      <a href="../index.html" class="relative flex-shrink-0 z-10" aria-label="SCCD 首頁 Home">
        <div id="header-logo" class="w-[180px] h-[180px]"></div>
      </a>

      <!-- 彈性空間，把右側組推到最右 -->
      <div class="flex-1"></div>

      <!-- Mode 按鈕（圓底）＋漢堡（方底）：2026-09-27 桌面 nav bars 全拆、改漢堡開 .mobile-nav 面板（≥1200 樣式見 navigation.css）。
           兩顆底色＝theme-fg 反色（mode1 黑底 / mode2 白底，buttons.css）；漢堡共用 .mobile-menu-btn → mobile-menu.js 一起綁。
           兩顆間距 ml-md 24＝library 灰卡 next 鈕 → mode → 漢堡三顆等距（library-card.js DESK_RIGHT，user 2026-09-27） -->
      <div id="mode-btn" data-bar="mode" class="flex-shrink-0 flex items-center justify-center rounded-full" style="transition: background var(--dur-base) ease;">
        <button class="theme-toggle-btn" aria-label="Toggle theme mode">
          <span class="icon icon-mode-1" data-header-mode-icon></span>
        </button>
      </div>
      <div id="menu-btn" data-bar="menu" class="flex-shrink-0 flex items-center justify-center ml-md">
        <button class="mobile-menu-btn w-full h-full flex items-center justify-center" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-nav-panel">
          <span class="icon icon-menu" data-menu-swap-icon></span>
        </button>
      </div>


    </div>

    <!-- 手機版：logo + 漢堡按鈕（pt lg / pb md，user 2026-07-13；矮橫向 landscape.css 蓋回 py-md＝92 帶不動） -->
    <div class="grid-12 items-center pt-lg pb-md md:hidden">
      <div class="col-span-6 relative flex items-center">
        <!-- Lottie 圓圈 logo：absolute + -top-7（-28px）＝playwright 實測校準，56×56 圓圈視覺中心
             對齊 mode/menu 鈕列中心（cy 46）；公式推導（-4）會偏低 24px——Lottie svg 內距不透明，以量測為準
             SCCD 文字 logo：normal flow 在 col-span-6 內，flex items-center 自動垂直對齊 mode/menu btn 那排
             兩個 sibling 互斥（Lottie 顯示時 SCCD .hidden；進 /create 反過來），由 header.js 切換 -->
        <a href="../index.html" class="absolute -top-7 left-0 z-50" data-mobile-logo-lottie-anchor aria-label="SCCD 首頁 Home">
          <div id="header-logo-mobile" class="w-[56px] h-[56px]"></div>
        </a>
        <a href="../index.html" id="header-logo-mobile-sccd" class="hidden z-50" data-mobile-logo-sccd-anchor aria-label="SCCD 首頁 Home"></a>
      </div>
      <div class="col-span-6 flex justify-end items-center gap-sm relative z-50">
        <!-- mobile mode-btn：跟桌面 #mode-btn 同 bg 邏輯（bg = page bg / mode-aware）— 用 #mode-btn-mobile id 對接 buttons.css 規則
             圓底（rounded-full）— 跟桌面 #mode-btn 視覺一致；menu btn 才是方形 -->
        <div id="mode-btn-mobile" data-bar="mode" class="mobile-header-btn rounded-full flex items-center justify-center">
          <button class="theme-toggle-btn" aria-label="Toggle theme mode">
            <span class="icon icon-mode-1" data-header-mode-icon></span>
          </button>
        </div>
        <!-- mobile menu-btn：方形（user 2026-05-25 拍板）；漢堡 icon 加旋轉動畫（mobile-menu.js 控）
             icon 開關用 inline style.display 切換（避 Tailwind .hidden vs FA display:inline-block cascade 競爭） -->
        <div class="mobile-header-btn flex items-center justify-center">
          <button class="mobile-menu-btn w-full h-full flex items-center justify-center" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-nav-panel">
            <span class="icon icon-menu icon-l mobile-menu-icon-rotate" data-mobile-menu-icon="open"></span>
            <span class="icon icon-arrow-right icon-l" data-mobile-menu-icon="close" style="display:none"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 手機版全螢幕選單（桌面版隱藏）
       兩組對應桌面 header bar 設計：
       上組（about-group）= 桌面 about-bar 內 5 個（About / Faculty / Curriculum / Activities / Admissions）
       下組（utility-group）= 桌面右側獨立 bar 們（Library / Atlas / A.A. / CREATE!）
       中間用 flex-1 空白撐開分組視覺 -->
  <div class="mobile-nav fixed inset-0 bg-white z-40 md:hidden flex flex-col" id="mobile-nav-panel" role="dialog" aria-modal="true" aria-label="主選單 Main menu" style="transform: translateX(-100%);">
    <div class="site-container flex-1 flex flex-col pt-6xl pb-4xl">
      <nav class="flex-1 flex flex-col overflow-y-auto overflow-x-hidden">
        <!-- 上組：about-bar 內 5 項，順序對齊桌面：About → Faculty → Curriculum → Activities → Admissions
             位置靠容器 pt-6xl(128) 清開 header 即可（user 2026-07-09 拿掉原 mt-3xl 額外下推） -->
        <ul class="flex flex-col gap-sm">
          <li><a href="about.html" class="mobile-nav-link block text-xl font-bold"><span class="mobile-nav-en" data-label-key="nav.about" data-label-part="en">About</span> <span class="mobile-nav-zh" data-label-key="nav.about" data-label-part="zh">關於</span></a></li>
          <li><a href="faculty.html" class="mobile-nav-link block text-xl font-bold"><span class="mobile-nav-en" data-label-key="nav.faculty" data-label-part="en">Faculty</span> <span class="mobile-nav-zh" data-label-key="nav.faculty" data-label-part="zh">師資</span></a></li>
          <li><a href="curriculum.html" class="mobile-nav-link block text-xl font-bold"><span class="mobile-nav-en" data-label-key="nav.curriculum" data-label-part="en">Curriculum</span> <span class="mobile-nav-zh" data-label-key="nav.curriculum" data-label-part="zh">課程</span></a></li>
          <li><a href="activities.html" class="mobile-nav-link block text-xl font-bold"><span class="mobile-nav-en" data-label-key="nav.activities" data-label-part="en">Activities</span> <span class="mobile-nav-zh" data-label-key="nav.activities" data-label-part="zh">動態</span></a></li>
          <li><a href="admission.html" class="mobile-nav-link block text-xl font-bold"><span class="mobile-nav-en" data-label-key="nav.admission" data-label-part="en">Admissions</span> <span class="mobile-nav-zh" data-label-key="nav.admission" data-label-part="zh">入學</span></a></li>
        </ul>

        <!-- 中間空白撐開（兩組視覺分離） -->
        <div class="flex-1"></div>

        <!-- 下組：utility（Library / Atlas / A.A. / CREATE!） -->
        <ul class="flex flex-col gap-sm">
          <li><a href="library.html" class="mobile-nav-link block text-xl font-bold"><span class="mobile-nav-en" data-label-key="nav.library" data-label-part="en">Library</span> <span class="mobile-nav-zh" data-label-key="nav.library" data-label-part="zh">檔案室</span></a></li>
          <li><a href="atlas.html" class="mobile-nav-link block text-xl font-bold"><span class="mobile-nav-en" data-label-key="nav.atlas" data-label-part="en">Atlas</span> <span class="mobile-nav-zh" data-label-key="nav.atlas" data-label-part="zh">圖譜</span></a></li>
          <!-- TEMP HIDDEN 2026-05-26：Alumni 頁暫時隱藏（user 要求），mobile nav 不渲染系友會入口
          <li><a href="alumni.html" class="mobile-nav-link block text-xl font-bold"><span class="mobile-nav-en">A.A.</span> <span class="mobile-nav-zh">系友會</span></a></li>
          -->
          <!-- /TEMP HIDDEN -->
          <li><a href="create.html" class="mobile-nav-link block text-xl font-bold"><span class="mobile-nav-en" data-label-key="nav.create" data-label-part="en">CREATE!</span> <span class="mobile-nav-zh" data-label-key="nav.create" data-label-part="zh">創造！</span></a></li>
        </ul>
      </nav>
    </div>
  </div>
</header>

<!-- 桌面（≥1200）左下「當前頁」卡：#page-indicator＝旋轉遮罩、內層＝卡（navigation.css 檔尾）；文字由 header.js updateNavActive 填。
     跟著內容走＝原生 sticky（同 nav btn），所以放 fixed header 外：#page-indicator-track 是隱形軌道（absolute，
     hero 底 → footer 頂，header.js layoutPageIndicatorTrack 寫 top/height），卡在軌道底端 sticky。z 同 header（50）→
     slide-in / lightbox overlay 照樣蓋住；首頁不填字（:empty 藏） -->
<div id="page-indicator-track" aria-hidden="true"><div id="page-indicator"><div class="page-indicator-card"></div></div></div>

<!-- 全站手機 header 底色帶：header 三 mode 皆透明，手機時 logo/漢堡/mode 鈕後方會透出頁面內容。
     此 fixed 帶用 mode-aware var(--theme-bg) 補實頂部 92px。sibling of <header>（#site-header 是 static → root
     stacking context，z-40 在 header 內容之下、slide-in/overlay 之下）；捲到 footer 由 header.js 收起。
     規則在 navigation.css .mobile-header-bg；桌面 data-bar 自帶底色 → md:hidden。app 頁(generate/atlas/library) CSS gate 掉。 -->
<div class="mobile-header-bg md:hidden" aria-hidden="true"></div>
