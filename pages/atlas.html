<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas 圖譜 - SCCD</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body class="overflow-hidden h-screen">

  <!-- Header -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main id="page-content">
    <!-- 視覺隱藏頁面主標題（atlas 是全視覺星雲、無文字標題；給報讀器/SEO 地標。floating 節點維持 button 不當 heading）-->
    <h1 class="sr-only">圖譜 Atlas — 實踐大學媒體傳達設計學系關係圖譜</h1>
    <section id="atlas-main">
      <div id="atlas-stage">
        <div id="atlas-zoom">
          <div id="atlas-content">
            <!-- SVG 線層 + 點+label 由 atlas.js 注入 -->
          </div>
        </div>
      </div>

      <!-- 左上角 filter — anchor-nav-inner 內 EN/ZH 兩行 stack（filter btn 專用 column override 在 atlas.css） -->
      <div id="atlas-filter" aria-label="Atlas filter">
        <button class="atlas-filter-btn w-fit text-left" data-filter="faculty">
          <span class="anchor-nav-inner">
            <span class="atlas-filter-en">Professors</span>
            <span class="atlas-filter-zh">歷屆教師</span>
          </span>
        </button>
        <button class="atlas-filter-btn w-fit text-left" data-filter="alumni">
          <span class="anchor-nav-inner">
            <span class="atlas-filter-en">Alumni</span>
            <span class="atlas-filter-zh">系友</span>
          </span>
        </button>
        <button class="atlas-filter-btn w-fit text-left" data-filter="partners">
          <span class="anchor-nav-inner">
            <span class="atlas-filter-en">Partners</span>
            <span class="atlas-filter-zh">合作單位</span>
          </span>
        </button>
      </div>

      <!-- 左下角 layout toggle -->
      <button id="atlas-layout-btn" aria-label="切換視圖">
        <span class="atlas-layout-inner">
          <span class="icon icon-atlas-list"></span>
        </span>
      </button>
    </section>

    <!-- 右下角細節面板（僅標題 + 説明，無 tag；城市不顯示卡片）
         放 #atlas-main 外面：#atlas-main z-index:0 是 stacking context，放裡面整個子樹被壓在 z=0 層、
         detail 自身 z-index 再高都蓋不過 mode3 鉛筆面板（9998）→ 搬出來 + z-index 9999 才蓋得過
         mask（2026-08-16 進場由 clip-path 改 clip-reveal）：定位/旋轉/遮罩在 mask、卡片本體在內滑動 -->
    <div id="atlas-detail-mask">
      <aside id="atlas-detail" aria-live="polite">
        <div class="atlas-detail-name" data-atlas-detail-name></div>
        <div class="atlas-detail-desc" data-atlas-detail-desc></div>
      </aside>
    </div>
  </main>

  <!-- Footer：atlas 不顯示 footer，但容器必須存在 —— first-load 為 atlas 時 initFooter() 才找得到，
       否則整個 session footer 永久消失（router 對 atlas 自動設 display:none） -->
  <div id="site-footer"></div>

  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script type="module" src="../js/main-modular.js"></script>

</body>
</html>
