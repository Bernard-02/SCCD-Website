<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/webp" href="../images/favicon.webp">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <meta name="description" content="SCCD 網站導覽與無障礙聲明。Site map and accessibility statement.">
  <link rel="canonical" href="https://sccd.usc.edu.tw/accessibility">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SCCD 實踐大學媒體傳達設計學系">
  <meta property="og:title" content="Site Map - SCCD">
  <meta property="og:description" content="SCCD 網站導覽與無障礙聲明。Site map and accessibility statement.">
  <meta property="og:url" content="https://sccd.usc.edu.tw/accessibility">
  <meta property="og:image" content="https://sccd.usc.edu.tw/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Site Map - SCCD</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/output.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>

  <!-- Header -->
  <div id="site-header"></div>

  <!-- Main Content
       id="page-content" 是 SPA router 的注入錨點，直接訪問必須有。樣式見 css/components/legal.css。
       .legal-regulations 沿用規章頁的 .reg-line 版面（見 renderSitemapLine）——網站導覽每列＝一個連結。 -->
  <main id="page-content">

    <section class="snap-zone legal-page-section legal-sitemap legal-regulations">
      <div class="site-container">
        <div class="grid-12">

          <!-- 左欄：sticky title chip（左下角，比照 regulations / support / policy-and-statements） -->
          <div class="legal-title-col col-span-12 md:col-span-5">
            <div class="legal-title-block">
              <h1 class="hero-title text-2xl text-black inline-block" data-hero-hl>
                SITE MAP
              </h1>
              <h1 class="hero-title-cn text-2xl text-black inline-block" data-hero-hl>
                網站導覽
              </h1>
            </div>
          </div>

          <!-- 右欄：內容（async 由 legal-data-loader 的 loadSitemap 填入 #legal-content）：
               無障礙聲明（zebra 一列）+ 網站地圖（每個主頁一列、卡片列分頁 deep-link）。更新日期在聲明列副標。 -->
          <div class="legal-content-col col-span-12 md:col-span-7">
            <div id="legal-content"></div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <div id="site-footer" class="snap-zone"></div>

  <!-- JavaScript -->
  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/Draggable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/InertiaPlugin.min.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script type="module" src="../js/main-modular.js"></script>

</body>
</html>
