<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activities - SCCD</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>

  <!-- Header -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main id="page-content">
    <!-- 即將上線 Coming Soon（2026-09-12，user 定案：直接沿用 hero title 那套＝散佈/旋轉/位置/字級全走 initHeroAnimation，
         只把文字換成 COMING SOON / 即將上線）。整段就是一個標準 hero（.hero-rand-grid 桌面 + .hero-mobile 手機），
         但只留兩個標題、拿掉 banner + 說明段（randomizeHeroLayout / hero-mobile-sync 對缺席元素皆有 guard）。
         原內容（nav/panels）暫移除、git 保留；還原＝git revert 本檔。頁面其餘 init（section-switch/search/PDF viewer）皆 null-safe 早退。 -->
    <section class="snap-zone min-h-screen md:h-screen relative overflow-x-clip md:overflow-hidden">
      <!-- 手機版 -->
      <div class="hero-mobile">
        <div class="hero-mobile-text">
          <h1 class="text-black hero-mobile-title" data-hero-hl></h1>
          <h1 class="text-black hero-mobile-title-cn" data-hero-hl></h1>
        </div>
      </div>
      <!-- 桌面版 -->
      <div class="hero-rand-grid">
        <h1 class="hero-title text-black inline-block" data-hero-hl>COMING SOON</h1>
        <h1 class="hero-title-cn text-black inline-block" data-hero-hl>即將上線</h1>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <div id="site-footer" class="snap-zone"></div>

  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollToPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/Draggable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/InertiaPlugin.min.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script type="module" src="../js/main-modular.js"></script>

</body>
</html>
