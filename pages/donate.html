<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate - SCCD</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>

  <!-- Header -->
  <div id="site-header"></div>

  <!-- Main Content
       id="page-content" 是 SPA router 的注入錨點，直接訪問必須有。
       Layout 比照 legal pages（regulations / policy-and-statements）：左欄 sticky title chip + 右欄內文。
       外層 shell 樣式見 css/components/legal.css，右欄內文排版見 css/components/support.css。 -->
  <main id="page-content">

    <section class="snap-zone legal-page-section legal-support">
      <div class="site-container">
        <div class="grid-12">

          <!-- 左欄：sticky title chip（左下角，比照 regulations / policy-and-statements） -->
          <div class="legal-title-col col-span-12 md:col-span-5">
            <div class="legal-title-block">
              <h1 class="hero-title text-2xl text-black inline-block" data-hero-hl>DONATE</h1>
              <h1 class="hero-title-cn text-2xl text-black inline-block" data-hero-hl>捐贈</h1>
            </div>
          </div>

          <!-- 右欄：內文（async 由 legal-data-loader 填入 #legal-content；資料見 data/support.json）
               support 無「最後更新」故不放 #legal-updated 區塊
               inner-scroll-scroll-col：同 regulations.html——box 捲動路徑、開 item 不關 window 磁吸 -->
          <div class="legal-content-col inner-scroll-scroll-col col-span-12 md:col-span-7">
            <!-- 手機 header blocker（同 activities/admission）：透明 fixed site-header 下、sticky zebra title 上方
                 透明帶會露出捲上來的展開內容 → sticky theme-bg 帶補實。放 col 內（非 section 第一子）：
                 legal section 無 padding-top，margin-top:-8rem 會 parent-child margin collapse 整段上移；
                 col 有 padding-top 擋住 collapse、寬度同 list＝蓋好蓋滿。詳見 lists.css .list-mobile-header-blocker -->
            <div class="list-mobile-header-blocker md:hidden" aria-hidden="true"></div>
            <div id="legal-content"></div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <div id="site-footer" class="snap-zone"></div>

  <!-- JavaScript -->
  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/Draggable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/InertiaPlugin.min.js"></script>
  <script src="../js/utils/helpers.js"></script>
  <script type="module" src="../js/main-modular.js"></script>

</body>
</html>
