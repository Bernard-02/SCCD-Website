<!DOCTYPE html>
<!-- overflow-x:clip（html+body）：子展覽 gallery 全寬 6-slot + hero banner 兩側溢出，直接載入/refresh 時
     router needsClipX 不一定跑到 → 內嵌 clip 兜底防整頁橫向 pan；clip 不建 scroll container（sticky 仍對 viewport） -->
<html lang="zh-Hant" style="overflow-x: clip;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/webp" href="../images/favicon.webp">
  <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
  <meta name="description" content="SCCD 畢業展：歷屆畢業展資訊、參展作品與展場紀錄。SCCD degree show archives.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SCCD 實踐大學媒體傳達設計學系">
  <meta property="og:title" content="Degree Show - SCCD">
  <meta property="og:description" content="SCCD 畢業展：歷屆畢業展資訊、參展作品與展場紀錄。SCCD degree show archives.">
  <meta property="og:image" content="https://sccd.usc.edu.tw/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Degree Show - SCCD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Noto+Sans+TC:wght@400..600&family=Noto+Sans+JP:wght@400..600&family=Noto+Sans+SC:wght@400..600&display=swap">
  <link rel="stylesheet" href="../css/output.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
</head>
<body style="overflow-x: clip;">

  <!-- Header -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main id="page-content">
    <!-- Hero Section
         背景圖改成 .hero-banner（占畫面一部分 + 隨機旋轉 + clip-path reveal 進場，跟其他 hero 一致）；
         字卡保留原本固定左下三段排版（年份 h4 / 英標 h2 / 中標 hero-title 大字）— 不套 hero-rand-grid 不參與 random placement
         手機版 .hero-mobile 圖墊底 + 文字 stack 疊在圖上（hero-mobile-sync.js 從桌面 clone 文案+banner src）
         進場順序由 chip 的 data-hero-enter 控：年份(1) 先進、英中標題(2) 一起進場 t=0.5（user 2026-06-03）
         data-hero-title-last 必須保留：hero-animation 靠它改「subtitles 先 → title 後」順序，landscape.css 的 DSD hero 規則也 scope 在它上面 -->
    <!-- 手機高度交給 .hero-mobile（variables.css 收斂到 bg 圖底緣，圖維持 4/5.5 natural aspect 不裁切）；
         桌面維持 h-screen -->
    <section class="snap-zone md:h-screen relative overflow-x-clip md:overflow-hidden" data-hero-title-last>
      <!-- 手機版（< 768px）：圖+文字 stack -->
      <div class="hero-mobile">
        <div class="hero-mobile-bg">
          <img src="" alt="">
        </div>
        <div class="hero-mobile-text">
          <!-- 年份 h6（user 2026-06-11）；font-size 由 variables.css [data-hero-title-last] 規則釘死
               （hero.css .hero-mobile-text-en 的 p1 與 typography h6 跨 layer 打架，不靠 cascade 賭） -->
          <p class="text-black hero-mobile-text-en font-bold" data-hero-hl></p>
          <h1 class="text-black hero-mobile-title dshow-hero-title text-2xl" data-hero-hl></h1>
          <h1 class="text-black hero-mobile-title-cn dshow-hero-title text-2xl" data-hero-hl></h1>
        </div>
      </div>
      <!-- 桌面版（≥ 768px）：
           1) .hero-rand-grid 只包 banner（單一元素 → randomizeHeroLayout 仍會給它隨機 corner+rotation；進場＝img 在 banner 遮罩內滑入 reveal，見 hero-animation.js）
           2) 字卡是 grid 同層 sibling 用 absolute 左下定位（不在 grid 內 → 不吃 random placement，固定左下） -->
      <div class="hero-rand-grid">
        <div class="hero-banner">
          <img id="hero-img" src="" alt="">
        </div>
      </div>

      <!-- 字卡左下排版：保留原本 design 年份 h4 + 英標 h2 + 中標 hero-title 大字，固定位置不 random -->
      <div class="hidden md:block absolute inset-0 z-10 pointer-events-none">
        <div class="site-container h-full">
          <div class="h-full flex flex-col items-start justify-end pb-3xl md:pb-2xl gap-md">
            <p id="text-year" class="hero-text-en text-xl font-bold text-black inline-block" data-hero-hl data-hero-enter="1"></p>
            <h1 id="text-title-en" class="hero-text-cn dshow-hero-title text-2xl text-black inline-block font-bold" data-hero-hl data-hero-enter="2"></h1>
            <h1 id="text-title" class="hero-title dshow-hero-title text-2xl text-black inline-block font-bold" data-hero-hl data-hero-enter="2"></h1>
          </div>
        </div>
      </div>
    </section>

    <!-- Events Section（min 100vh 一屏；描述文字 2026-07-13 移除，內容頂對齊＝snap 落點後緊接 header 下方）
         id 給 variables.css 手機 grid-20 column-gap:0 修正用（19 個 gap 撐爆容器 → 內容溢出右緣，同 about 修法）
         ⚠️ 桌面 2026-10-20 起清單文字不在這（併進下方子展覽 tab 說明卡），這屏只放 KV 海報；沒海報＝整段藏 -->
    <section id="dsd-desc-section" class="snap-zone bg-white relative" style="min-height: 100vh;">
      <div class="site-container w-full pt-6xl pb-3xl">
        <!-- Events 區塊：桌面左半＝畢展 KV（直式 poster），右半＝活動清單（標題一 row → 日期:地點 1:1 → detail row，城市在地點下方）。
             無 events → 整塊 hidden；無 data.poster → KV 不渲染但 list 仍靠右（user 2026-08-17）。 -->
        <!-- 文字一律 p1；活動/地點/城市顯示中英雙語（時間僅顯示一行） -->
        <div id="events-section" class="grid-20 hidden">
          <!-- 清單：桌面左半（col 5-13，避開 col 1-4 sticky 資訊卡）；直式海報改靠右上角後清單再擴一欄（user 2026-08-18「poster 對齊右上角、讓 events 區更寬」）；桌面內捲＋右側 scrollbar -->
          <div class="col-span-full md:col-start-5 md:col-span-9">
            <!-- Data rows（JS render） -->
            <div id="events-list" class="dsd-events-scroll list-scroll flex flex-col gap-lg md:gap-xl"></div>
          </div>
          <!-- KV：桌面 only（.dsd-events-kv 預設 display:none，JS 有 poster 時加 .has-kv）；
               poster 容器（col 14-20，約等於直式海報自然寬），直式圖靠右上角（margin-left:auto）＝右緣貼齊全站內容右緣（user 2026-08-18） -->
          <div id="events-kv" class="dsd-events-kv col-span-full md:col-start-14 md:col-span-7">
            <img id="events-kv-img" src="" alt="" class="dsd-events-kv-img">
          </div>
          <!-- 主影片欄：真桌面有海報＋有影片時 JS 把 #video-wrapper 搬進來、跟海報左右並排（user 2026-10-20，CSS 在 cards.css）；其餘情況恆藏 -->
          <div id="events-video" class="dsd-events-video"></div>
        </div>
      </div>
    </section>

    <!-- Sticky Info Card：scroll 進入 description section pt 之後出現、釘左側
         結構沿用 anchor-nav-inner pattern：外 .sticky-chip 透明 wrapper，內 .sticky-chip-inner span 撐底色與 padding
         - year chip（text-s，accent 底跟 title 同色 cardColor，absolute 疊在 title chip 上方＝courses program bar 類別 label 定位）
         - title chip（text-lg，英上中下同一張）
         原 title 下方的 events nav 2026-10-20 撤掉：子展覽改在 gallery 上方 tab 切換（buildDesktopEventTabs）
         範圍：description section pt-6xl 後 → next-project 前
         #sticky-year-chip position:absolute（bottom:100% 疊 title 上）脫離 flex flow → 不影響 title group 的視覺位置 -->
    <div id="sticky-info-card" class="hidden md:block fixed pointer-events-none"
         style="top: calc(var(--nav-line) + 40px); left: var(--container-padding, 60px); z-index: 20; opacity: 0; visibility: hidden;">
      <div class="sticky-title-group relative flex flex-col items-start" style="gap: 0.6rem; width: max-content;">
        <!-- year chip：釘 title chip 上方（absolute bottom:100%，脫離 flex flow → 不影響 title group 高度，同 branch chip 手法）；
             accent 底跟 title 同 cardColor（JS 設）＝ courses program bar「類別 label 疊在名稱上方」的定位 pattern（user 2026-08-18） -->
        <div id="sticky-year-chip" class="sticky-chip absolute left-0" style="bottom: 100%; margin-bottom: 0.6rem;">
          <span id="sticky-year" class="sticky-chip-inner text-s font-bold"></span>
        </div>
        <div id="sticky-title-chip" class="sticky-chip">
          <span class="sticky-chip-inner text-s font-bold">
            <span id="sticky-title-en" class="block"></span>
            <span id="sticky-title" class="block"></span>
          </span>
        </div>
      </div>
    </div>

    <!-- 左下角返回 degree show 按鈕：套 sticky-chip 結構（外 wrapper clip-path reveal + inner 撐 bg + padding）
         left 對齊 hero 標題 / sticky-info-card / logo 左緣（var(--container-padding)）
         顯隱由 setupStickyAndHeroChips 跟 sticky title chip 同節奏切（clip-path 由上往下 reveal） -->
    <a id="degree-show-back-btn" href="/activities?section=degree-show"
       class="sticky-chip hidden md:block"
       aria-label="返回 Degree Show">
      <span class="sticky-chip-inner">
        <span class="icon icon-arrow-left"></span>
      </span>
    </a>

    <!-- 分享鈕：返回鈕右邊、同款（user 2026-10-21）；全站 share-modal（[data-share-btn]）接管，
         data-share-url 由 JS 寫本頁網址（預設推算會砍掉 ?query＝丟掉是哪一屆） -->
    <button type="button" id="degree-show-share-btn" data-share-btn
            class="sticky-chip hidden md:block"
            aria-label="分享 Share">
      <span class="sticky-chip-inner">
        <span class="icon icon-share"></span>
      </span>
    </button>

    <!-- Ref 按鈕：back btn 右邊；點擊展開 ref chip list（論壇 / 工作營 / 講座 等 non-exhibition events 的 refs）
         JS 在 loadDegreeShowDetail 內 setupRefBtn 動態填 popover；無 refs → 整顆 hidden
         結構 / 樣式跟 back btn 一樣（sticky-chip + strict B/W），clip-reveal 由 setupStickyAndHeroChips 同步控
         popover 內 chip card 沿用 lightbox-ref-popover / lightbox-ref-card 既有樣式 -->
    <button type="button" id="degree-show-ref-btn"
            class="sticky-chip hidden md:block"
            aria-label="顯示 references">
      <span class="sticky-chip-inner">
        <span class="icon icon-ref-lightbox"></span>
      </span>
    </button>
    <div id="degree-show-ref-popover" class="lightbox-ref-popover">
      <div id="degree-show-ref-stack" class="lightbox-ref-stack"></div>
    </div>

    <!-- 主影片 Section：桌面一屏 snap（2026-07-13 全頁 100vh 分屏）——影片左緣對齊 grid col-5
         （同子展覽 desc 起點，避開左側 sticky chip），col-span-16 等比縮小、垂直置中。
         ⚠️ md:flex 放內層不放 section：section 的 .hidden 會被 media query 內的 md:flex（source order 較後）蓋掉。
         md:pt-[92px]＝header 帶高：置中改在「header 下緣～屏底」間算，不然影片頂會貼 header（user 2026-07-13）。
         真桌面另由 scroll-snap.css 套影片寬上限（高 ≤ 100svh − 196，扁螢幕等比縮，2026-10-20） -->
    <section id="video-outer-section" class="snap-zone bg-white pt-3xl md:pt-[92px] md:h-screen hidden">
      <div class="site-container w-full md:h-full md:flex md:items-center">
        <div id="video-section" class="grid-20 w-full">
          <div class="col-span-full md:col-start-5 md:col-span-16">
            <div id="video-wrapper" class="w-full aspect-video bg-black">
              <!-- Video content injected by JS -->
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Per-event 區：JS 依 data.events 動態 render（renderEventGalleries）
         桌面＝一屏 section 比照 about programs：上方 event 標題 tab（依序、全部 event）＋左說明卡（日期／講者／地點，
         原上方 events 清單併進來）＋右圖片輪播，點 tab 原地換（2026-10-20）；沒圖的 event 右側留空
         手機／矮橫向＝有圖的 event 每個一段 .event-gallery-section＋sticky tab strip 點擊捲動（events 清單仍在上方） -->
    <!-- 手機 py-3xl：跟上方主影片 / 下方紀錄影片留呼吸空間（section 自身手機無 py，間距走 flex gap）；桌面歸零（section 各自 md:py-6xl） -->
    <div id="event-galleries-root" class="bg-white flex flex-col gap-6xl py-3xl md:py-0 md:block"></div>

    <!-- 紀錄影片 Section：同主影片——桌面一屏 snap、col-5 起點、header 下緣以下垂直置中 -->
    <section id="documentary-outer-section" class="snap-zone bg-white pb-3xl md:pb-0 md:pt-[92px] md:h-screen hidden">
      <div class="site-container w-full md:h-full md:flex md:items-center">
        <div id="documentary-video-section" class="grid-20 w-full">
          <div class="col-span-full md:col-start-5 md:col-span-16">
            <div id="documentary-video-wrapper" class="w-full aspect-video bg-black">
              <!-- Documentary video content injected by JS -->
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Next Project Section：
         桌面：兩張 poster overlap（左=prev/older 在上，右=next/newer 在下偏 50%），
              hover 顯示年份/英中標題（隨機色與旋轉，year 在上、名稱在下；原 50% 黑暗幕 2026-10-01 撤，user「hover 不調不透明度」），
              另一張同時 clip-path 掃入隨機色（仿首頁 newsOverlay）；
         手機：單純 stack。
         posters 隨機旋轉 -4°~6°（排除 0）。 -->
    <!-- 桌面一屏 snap（2026-07-13）：海報縮放進 100vh 由 recompute() 算（fit 超出時等比縮 posterW + 構圖置中） -->
    <section id="next-project-section" class="snap-zone bg-white relative overflow-hidden pt-3xl pb-3xl md:py-0 md:h-screen md:flex md:items-center">
      <!-- 桌面版：overlap stage -->
      <div id="next-project-stage" class="hidden md:block relative w-full">
        <!-- prev：older year，左上（66vw + 左移 -8vw，與 next 在中段重疊） -->
        <a id="prev-link" href="#" class="block absolute" aria-label="上一屆畢業展 Previous degree show" style="top: 0; left: -8vw; width: 66vw; z-index: 1;">
          <div id="prev-card" class="relative">
            <img id="prev-img" src="" alt="" class="block w-full h-auto pointer-events-none">
            <div id="prev-clip" class="absolute inset-0 pointer-events-none" style="clip-path: inset(100% 0 0 0); transition: clip-path var(--dur-medium) var(--ease-wipe);"></div>
          </div>
        </a>
        <!-- next：newer year，右下（66vw + 右移 -8vw） -->
        <a id="next-link" href="#" class="block absolute" aria-label="下一屆畢業展 Next degree show" style="right: -8vw; width: 66vw; z-index: 1;">
          <div id="next-card" class="relative">
            <img id="next-img" src="" alt="" class="block w-full h-auto pointer-events-none">
            <div id="next-clip" class="absolute inset-0 pointer-events-none" style="clip-path: inset(100% 0 0 0); transition: clip-path var(--dur-medium) var(--ease-wipe);"></div>
          </div>
        </a>

        <!-- Labels groups 改放到 stage level（不再 nested in card 內），位置以 viewport 為主：
             - prev 釘 stage 左下、next 釘 stage 右上（這是「圖片之外」的相對白空間）
             - 不被 card rotation 影響、不被 card 結構裁切
             - gap 對齊 hero `gap-md`（1.5rem）
             - chip 預設 clip-path 隱藏，hover 時 stagger reveal（prev 從左到右、next 從右到左） -->
        <div id="prev-labels" class="absolute flex flex-col items-start pointer-events-none" style="bottom: 20%; left: 5vw; gap: var(--spacing-md); z-index: 5;">
          <p id="prev-year" class="text-xl font-bold whitespace-nowrap" style="padding: var(--card-pad-xl); color: var(--color-black); transform-origin: left center; clip-path: inset(0 100% 0 0); transition: clip-path var(--dur-medium) var(--ease-wipe);"></p>
          <p id="prev-title-en" class="dshow-next-title text-xl font-bold" style="padding: var(--card-pad-xl); color: var(--color-black); transform-origin: left center; clip-path: inset(0 100% 0 0); transition: clip-path var(--dur-medium) var(--ease-wipe);"></p>
          <p id="prev-title" class="dshow-next-title text-xl font-bold" style="padding: var(--card-pad-xl); color: var(--color-black); transform-origin: left center; clip-path: inset(0 100% 0 0); transition: clip-path var(--dur-medium) var(--ease-wipe);"></p>
        </div>
        <div id="next-labels" class="absolute flex flex-col items-end pointer-events-none" style="top: 20%; right: 5vw; gap: var(--spacing-md); z-index: 5;">
          <p id="next-year" class="text-xl font-bold whitespace-nowrap" style="padding: var(--card-pad-xl); color: var(--color-black); transform-origin: right center; clip-path: inset(0 0 0 100%); transition: clip-path var(--dur-medium) var(--ease-wipe);"></p>
          <p id="next-title-en" class="dshow-next-title text-xl font-bold" style="padding: var(--card-pad-xl); color: var(--color-black); transform-origin: right center; clip-path: inset(0 0 0 100%); transition: clip-path var(--dur-medium) var(--ease-wipe);"></p>
          <p id="next-title" class="dshow-next-title text-xl font-bold" style="padding: var(--card-pad-xl); color: var(--color-black); transform-origin: right center; clip-path: inset(0 0 0 100%); transition: clip-path var(--dur-medium) var(--ease-wipe);"></p>
        </div>
      </div>

      <!-- 手機版：左右並排色塊卡（user 2026-07-09 取消 poster thumbnail）——隨機互異 accent 底 +
           隨機旋轉（JS inline 填）+ 年份 / 英中標題；卡片版面在 variables.css .dsd-next-card-m。
           文字靠左、年份與標題同字級（text-s）；items-start + #next-link-m margin-top 造高低落差。
           文字不掛 .text-black（inverse 的 .text-black→white 會蓋掉），黑字由 .dsd-next-card-m color 統一給 -->
      <div class="md:hidden site-container flex flex-row items-start justify-center">
        <a id="prev-link-m" href="#" class="dsd-next-card-m block">
          <p id="prev-year-mobile" class="text-lg font-bold"></p>
          <p id="prev-title-en-mobile" class="dshow-next-title text-lg font-bold"></p>
          <p id="prev-title-mobile" class="dshow-next-title text-lg font-bold"></p>
        </a>
        <a id="next-link-m" href="#" class="dsd-next-card-m block">
          <p id="next-year-mobile" class="text-lg font-bold"></p>
          <p id="next-title-en-mobile" class="dshow-next-title text-lg font-bold"></p>
          <p id="next-title-mobile" class="dshow-next-title text-lg font-bold"></p>
        </a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <div id="site-footer" class="snap-zone"></div>

  <!-- JavaScript -->
  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollToPlugin.min.js"></script>
  <!-- Helper Functions - 必須在 main.js 之前載入 -->
  <script src="../js/utils/helpers.js"></script>
  <script type="module" src="../js/main-modular.js"></script>

</body>
</html>
