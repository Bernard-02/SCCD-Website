name: 產 library 封面 + 圖片轉 webp（每日）

# 每天自動：①把「還沒有封面」的新書 PDF 第一頁渲成封面圖回填 Directus
#          ②把檔案庫所有 jpeg/png 原地轉 webp（同 UUID、前台零改）補轉新上傳的圖
# 兩支腳本都 idempotent：沒有新書/新圖就 no-op。
on:
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 18:00 = 台北 02:00（離峰）
  workflow_dispatch: {}      # 也可在 GitHub Actions 頁面手動按一下立即觸發

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 腳本只依賴 playwright + Node builtin fetch/FormData/Blob；不需整包 npm ci
      - run: npm install playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/generate-library-covers.cjs
        env:
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
      # 封面產完後，把所有 jpeg/png（含新上傳圖與剛產的封面）原地轉 webp。idempotent：已是 webp 的自動跳過。
      # ⚠️弱主機每個 node process 約 12 張就連線雪崩（見 memory reference_directus_image_transform_webp）→
      #   改 loop 開「獨立 process、每批 12 張」（每批新連線繞開雪崩），跑到轉完或 5h 時間預算（Action 上限 6h）。
      #   全庫 ~15h＝一晚跑不完；被時間截斷沒關係，idempotent，隔天 02:00 自動接著補，約 3 晚清完。
      - run: |
          deadline=$(( $(date +%s) + 18000 ))   # 5h 預算（<Action 6h 上限；台北 02:00→07:00 離峰）
          zero=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            out=$(node scripts/convert-images-to-webp.cjs --limit 12 2>&1 || true)
            echo "$out" | tail -2
            conv=$(echo "$out" | grep -c '→' || true)   # 轉檔行含「KB → KB」；跳過/失敗行無 →
            if [ "$conv" -eq 0 ]; then zero=$((zero + 1)); else zero=0; fi
            if [ "$zero" -ge 5 ]; then echo "連續 5 批 0 轉檔 → 視為全部轉完，收工"; break; fi
            sleep 5
          done
        env:
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
