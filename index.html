<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/webp" href="images/favicon.webp">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="description" content="實踐大學媒體傳達設計學系（SCCD）官方網站——全國第一所成立「媒體傳達設計」之學系，培育整合數位科技與設計美學的跨域創意人才。The official site of Shih Chien University Communications Design.">
  <link rel="canonical" href="https://sccd.usc.edu.tw/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SCCD 實踐大學媒體傳達設計學系">
  <meta property="og:title" content="SCCD - Shih Chien University">
  <meta property="og:description" content="實踐大學媒體傳達設計學系（SCCD）官方網站——全國第一所成立「媒體傳達設計」之學系，培育整合數位科技與設計美學的跨域創意人才。The official site of Shih Chien University Communications Design.">
  <meta property="og:url" content="https://sccd.usc.edu.tw/">
  <meta property="og:image" content="https://sccd.usc.edu.tw/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>SCCD - Shih Chien University</title>
  <style>
    #intro-overlay { position: fixed; inset: 0; background: #ffffff; z-index: 10000; }
    /* 未渲染（reveal 前）＝隱形＋不可互動：opacity:0 不擋 pointer → mode btn 等會有 pointer cursor＋可點；
       --header-pe:none 讓隱形 header 的 logo/鈕不吃 hover/click（showHeader reveal 時設 inline --header-pe:auto 恢復；
       header 本體恆 none 放行中間空白，見 navigation.css）。user 2026-09-04 */
    #site-header header { opacity: 0; pointer-events: none; --header-pe: none; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Noto+Sans+TC:wght@400..600&family=Noto+Sans+JP:wght@400..600&family=Noto+Sans+SC:wght@400..600&display=swap">
  <link rel="stylesheet" href="css/output.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
  <!-- p5 不放 head（移除 render-blocking）；只剩 /create 進頁時載本地 generate-app/p5.min.js（WATCH 2026-10-26 起是 news 同款 banner，不用 canvas） -->
</head>
<body style="overflow:hidden">

  <!-- Intro Animation Overlay -->
  <div id="intro-overlay">
    <div id="intro-lottie"></div>
  </div>

  <!-- Header -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main id="page-content">
    <!-- 視覺隱藏的頁面主標題（語意/SEO/報讀器地標；首頁全視覺、無文字標題）-->
    <h1 class="sr-only">實踐大學媒體傳達設計學系 Shih Chien University Department of Communications Design (SCCD)</h1>
    <!-- 不設 z-index（不建 stacking context）：hover 的 news 海報要單獨蓋過 header logo、浮卡留在 logo 下（lists.css .hm-banner）
         手機高度＝100svh（landscape.css 檔頭／2a，工具列展開時的可視高） -->
    <section class="snap-zone h-screen" style="display:flex; align-items:flex-end; padding: var(--spacing-xl); position:relative; overflow:hidden;">

      <!-- Floating Items Layer -->
      <div id="floating-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; overflow:hidden;"></div>

      <!-- News Marquee Stack：3 條 news 旋轉堆疊在左下角＋最底一條 WATCH 影片入口（同款 banner，user 2026-10-26）；JS 動態渲染 + cycling（index-marquee.js） -->
      <div id="homepage-marquee-stack" style="position:absolute; left:0; bottom:0; width:100%; height:100%; pointer-events:none;"></div>

    </section>

  <!-- Video Player Lightbox（必須在 <main> 內，否則 SPA 從別頁切回 index 時不會被 swap 進來） -->
  <div id="video-player-overlay" style="display:none; position:fixed; inset:0; z-index:10000; background:var(--color-black); flex-direction:column; justify-content:center; align-items:center;">
    <video id="video-player" style="width:95%; max-height:90%; object-fit:contain;" preload="metadata" controlsList="nodownload" oncontextmenu="return false;"></video>

    <!-- 手機專用左上返回鍵（桌面用 video-controls 內的 close btn，預設隱藏） -->
    <!-- top:6rem 對齊手機 header logo 下方：header `py-md`(24px) + logo wrapper `-top-4`(-16px) + logo 80px = 88px 底邊 + ~8px 間距 ≈ 96px (6rem)；left 同 logo 邊距 -->
    <button id="video-mobile-close-btn" aria-label="關閉影片 Close video" style="display:none; position:absolute; top:6rem; left:1rem; z-index:10003; background:var(--color-green); color:var(--color-black); border:none; width:44px; height:44px; padding:0; line-height:1; align-items:center; justify-content:center;">
      <span class="icon icon-arrow-left" style="font-size:1.75rem;"></span><!-- 44 盒 −16＝28（同 lightbox pill 規格） -->
    </button>

    <!-- Controls 容器（三個獨立區塊，絕對定位在底部偏上） -->
    <div id="video-controls" style="position:absolute; bottom:3rem; left:0; right:0; padding: 0 24rem; display:flex; align-items:center; justify-content:space-between; pointer-events:none; opacity:0;">

      <!-- 區塊 1：返回鍵 — 正方形 48 盒＋32 icon（同全站黑方塊鈕規格，user 2026-10-21）。
           按鈕撐滿色塊＝整塊都是鈕、hover 整塊反色（lightbox.css）；返回 icon-xl 32；播放／音量／全螢幕 28 由 lightbox.css 給（不帶 size class，video-player.js 換態同） -->
      <div id="video-block-close" style="background:transparent; padding:0; width:3rem; height:3rem; flex:none; display:flex; align-items:center;">
        <button id="video-close-btn" aria-label="關閉影片 Close video" style="color:var(--color-white); background:none; border:none; padding:0; width:100%; height:100%; line-height:1; display:flex; align-items:center; justify-content:center;">
          <span class="icon icon-arrow-left icon-xl"></span>
        </button>
      </div>

      <!-- 區塊 2：中間 control bar -->
      <div id="video-block-center" style="background:transparent; padding:0 1.25rem; height:3rem; display:flex; align-items:center; gap:1.25rem; flex:1; min-width:0; margin:0 var(--spacing-sm);">

        <!-- Play -->
        <button id="video-play-btn" aria-label="播放／暫停 Play/Pause" style="color:var(--color-white); background:none; border:none; padding:0; line-height:1; display:flex; flex-shrink:0;"><!-- 寬＝icon（icon 固定正方形、play/pause 切換不跳寬，舊固定寬會在左邊多墊空白） -->
          <span class="icon icon-play"></span>
        </button>

        <!-- 時間軸（flex:1）— track 全黑 + fill 全黑（連續黑線）；thumb = 4px 寬黑色直線，靠上下伸出 5px 標位置。
             末子＝透明命中層撐到 thumb 高（14px）：只有 4px 線吃得到 hover/點擊，滑到 thumb 凸出處會變回箭頭（2026-10-01） -->
        <div id="video-progress-track" style="flex:1; height:4px; background:var(--color-black); position:relative; min-width:0; cursor:var(--cursor-pointer);">
          <div id="video-progress-fill" style="height:100%; width:0%; pointer-events:none; position:relative; background:var(--color-black);">
            <div id="video-progress-thumb" style="position:absolute; right:-2px; top:50%; transform:translateY(-50%); width:4px; height:14px; background:var(--color-black); pointer-events:none;"></div>
          </div>
          <div style="position:absolute; left:0; right:0; top:-5px; bottom:-5px;"></div>
        </div>

        <!-- 剩餘時間 -->
        <span id="video-time" class="text-s" style="color:var(--color-white); white-space:nowrap; flex-shrink:0;">0:00</span>

        <!-- Volume — hover 展開 slider；slider 全黑風格同 progress -->
        <div id="video-volume-wrap" style="display:flex; align-items:center; flex-shrink:0;">
          <button id="video-mute-btn" aria-label="靜音／取消靜音 Mute/Unmute" style="color:var(--color-white); background:none; border:none; padding:0; line-height:1;">
            <span class="icon icon-volume"></span>
          </button>
          <div id="video-volume-track" style="width:0; overflow:visible; transition:width 0.25s var(--ease-wipe), margin-left 0.25s var(--ease-wipe); height:4px; background:var(--color-black); position:relative; flex-shrink:0; cursor:var(--cursor-pointer);">
            <div id="video-volume-fill" style="height:100%; width:100%; background:var(--color-black); pointer-events:none; position:relative;">
              <div id="video-volume-thumb" style="position:absolute; right:-2px; top:50%; transform:translateY(-50%); width:4px; height:14px; background:var(--color-black); pointer-events:none; opacity:0; transition:opacity 0.25s;"></div>
            </div>
            <div style="position:absolute; left:0; right:0; top:-5px; bottom:-5px;"></div>
          </div>
        </div>

      </div>

      <!-- 區塊 3：全螢幕 -->
      <div id="video-block-fullscreen" style="background:transparent; padding:0; width:3rem; height:3rem; flex:none; display:flex; align-items:center;">
        <button id="video-fullscreen-btn" aria-label="全螢幕 Fullscreen" style="color:var(--color-white); background:none; border:none; padding:0; width:100%; height:100%; line-height:1; display:flex; align-items:center; justify-content:center;">
          <span class="icon icon-full-screen"></span>
        </button>
      </div>

    </div>
  </div>
  </main>

  <!-- Footer -->
  <footer id="site-footer-static" class="snap-zone footer-shell overflow-hidden">
    <div class="footer-inner h-full flex flex-col md:flex-row">

      <!-- Logo：桌面靠左貼齊 padding，正方形吃滿可用高度 -->
      <div class="footer-logo-area">
        <a href="../index.html" id="footer-logo" class="footer-logo-inner block" aria-label="SCCD 首頁 Home"></a>
      </div>

      <!-- 右側欄：桌面分上（隨機旋轉）下（privacy），手機線性堆疊 -->
      <div class="footer-right">

        <!-- 隨機分佈的旋轉項目
             DOM 順序＝手機直向視覺順序（social 貼 logo 下 → 電話 → 傳真 → email → 地址 → 學校卡）；
             桌面 scatter / 矮橫向 grid 都是顯式定位，不吃 DOM 順序 -->
        <div class="footer-random" data-fgroup="dept">

          <!-- Tab 與散佈項目 2026-08-11 起由 Directus 管理（footer_tabs / footer_items；後台是唯一來源），js/modules/ui/footer-content.js 渲染進來：tab 按鈕進 .footer-tabs、
               項目（資訊卡/連結卡/社群 icon）接在後面。後台拖曳＝順序；第一個 tab＝預設顯示群組。 -->
          <div class="footer-tabs"></div>

        </div>

        <!-- Privacy / 法務連結：連結由 Directus footer_legal 渲染（footer-content.js renderLegal，插在 a11y 標章之前）；
             a11y 標章與 copyright 維持靜態。 -->
        <div class="footer-privacy">
          <div class="flex flex-col gap-xs items-start">
            <!-- 無障礙標章 placeholder（88×31，手機先行；正式標章拿到後換成 <a><img></a> 並開桌面） -->
            <div class="footer-a11y-badge" aria-hidden="true"></div>
            <p class="footer-copyright">Copyright © SCCD</p>
          </div>
        </div>

      </div>

    </div>
  </footer>

  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollToPlugin.min.js"></script>
  <!-- Helper Functions - 必須在 main.js 之前載入 -->
  <script src="js/utils/helpers.js"></script>
  <script type="module" src="js/main-modular.js"></script>

</body>
</html>
