<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCCD - Shih Chien University</title>
  <style>
    #intro-overlay { position: fixed; inset: 0; background: #ffffff; z-index: 10000; }
    #site-header header { opacity: 0; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Bitter:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+TC:wght@400;600;700&family=Noto+Serif+JP:wght@400;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/output.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <!-- p5 不放 head（移除 render-blocking）；WATCH 卡已改純原生 canvas 不依賴 p5（index-yt-card.js initWatchChars），只剩 /create 進頁時載本地 generate-app/p5.min.js -->
</head>
<body style="overflow:hidden">

  <!-- Intro Animation Overlay -->
  <div id="intro-overlay">
    <div id="intro-lottie"></div>
  </div>

  <!-- Header -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main id="page-content">
    <!-- 視覺隱藏的頁面主標題（語意/SEO/報讀器地標；首頁全視覺、無文字標題）-->
    <h1 class="sr-only">實踐大學媒體傳達設計學系 Shih Chien University Department of Communications Design (SCCD)</h1>
    <section class="snap-zone h-screen" style="display:flex; align-items:flex-end; padding: var(--spacing-xl); position:relative; z-index:9998; overflow:hidden;">

      <!-- Floating Items Layer -->
      <div id="floating-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; overflow:hidden;"></div>

      <!-- News Marquee Stack（4 個 banner 旋轉排列在左下角；JS 動態渲染 + cycling） -->
      <div id="homepage-marquee-stack" style="position:absolute; left:0; bottom:0; width:100%; height:100%; z-index:15; pointer-events:none;"></div>

      <!-- YouTube Card：絕對定位，JS 負責隨機位置 + 旋轉
           width/height 改由 .homepage-card class 控制（桌面 160 / 手機 96，CSS 分流） -->
      <div id="homepage-yt-card" class="homepage-card" style="position:absolute; border-radius:50%; cursor:pointer; overflow:hidden; background:#000; display:flex; align-items:center; justify-content:center; z-index:20;">
        <div id="homepage-yt-chars" style="position:absolute;inset:0;"></div>
      </div>

    </section>

  <!-- Video Player Lightbox（必須在 <main> 內，否則 SPA 從別頁切回 index 時不會被 swap 進來） -->
  <div id="video-player-overlay" style="display:none; position:fixed; inset:0; z-index:10000; background:#000; flex-direction:column; justify-content:center; align-items:center;">
    <video id="video-player" style="width:95%; max-height:90%; object-fit:contain;" preload="metadata" controlsList="nodownload" oncontextmenu="return false;"></video>

    <!-- 手機專用左上返回鍵（桌面用 video-controls 內的 close btn，預設隱藏） -->
    <!-- top:6rem 對齊手機 header logo 下方：header `py-md`(24px) + logo wrapper `-top-4`(-16px) + logo 80px = 88px 底邊 + ~8px 間距 ≈ 96px (6rem)；left 同 logo 邊距 -->
    <button id="video-mobile-close-btn" aria-label="關閉影片 Close video" style="display:none; position:absolute; top:6rem; left:1rem; z-index:10003; background:#00FF80; color:#000; border:none; width:44px; height:44px; padding:0; line-height:1; align-items:center; justify-content:center;">
      <span class="icon icon-arrow-left icon-l"></span>
    </button>

    <!-- Controls 容器（三個獨立區塊，絕對定位在底部偏上） -->
    <div id="video-controls" style="position:absolute; bottom:3rem; left:0; right:0; padding: 0 24rem; display:flex; align-items:center; justify-content:space-between; pointer-events:none; opacity:0;">

      <!-- 區塊 1：返回鍵 — height fix 3rem 避免內 icon size 變化影響 pill 高度 -->
      <div id="video-block-close" style="background:transparent; padding:0 1rem; height:3rem; display:flex; align-items:center;">
        <button id="video-close-btn" aria-label="關閉影片 Close video" style="color:#fff; background:none; border:none; padding:0; line-height:1; display:flex; align-items:center;">
          <span class="icon icon-arrow-left icon-l"></span>
        </button>
      </div>

      <!-- 區塊 2：中間 control bar -->
      <div id="video-block-center" style="background:transparent; padding:0 1.25rem; height:3rem; display:flex; align-items:center; gap:1.25rem; flex:1; min-width:0; margin:0 1rem;">

        <!-- Play -->
        <button id="video-play-btn" aria-label="播放／暫停 Play/Pause" style="color:#fff; background:none; border:none; padding:0; line-height:1; width:1.5rem; text-align:center; flex-shrink:0;">
          <span class="icon icon-play icon-l"></span>
        </button>

        <!-- 時間軸（flex:1）— track 全黑 + fill 全黑（連續黑線）；thumb = 4px 寬黑色直線，靠上下伸出 5px 標位置 -->
        <div id="video-progress-track" style="flex:1; height:4px; background:#000; position:relative; min-width:0;">
          <div id="video-progress-fill" style="height:100%; width:0%; pointer-events:none; position:relative; background:#000;">
            <div id="video-progress-thumb" style="position:absolute; right:-2px; top:50%; transform:translateY(-50%); width:4px; height:14px; background:#000; pointer-events:none;"></div>
          </div>
        </div>

        <!-- 剩餘時間 -->
        <span id="video-time" class="text-s" style="color:#fff; white-space:nowrap; flex-shrink:0;">0:00</span>

        <!-- Volume — hover 展開 slider；slider 全黑風格同 progress -->
        <div id="video-volume-wrap" style="display:flex; align-items:center; gap:0.75rem; flex-shrink:0;">
          <button id="video-mute-btn" aria-label="靜音／取消靜音 Mute/Unmute" style="color:#fff; background:none; border:none; padding:0; line-height:1;">
            <span class="icon icon-volume icon-l"></span>
          </button>
          <div id="video-volume-track" style="width:0; overflow:visible; transition:width 0.25s cubic-bezier(0.25,0,0,1); height:4px; background:#000; position:relative; flex-shrink:0;">
            <div id="video-volume-fill" style="height:100%; width:100%; background:#000; pointer-events:none; position:relative;">
              <div id="video-volume-thumb" style="position:absolute; right:-2px; top:50%; transform:translateY(-50%); width:4px; height:14px; background:#000; pointer-events:none; opacity:0; transition:opacity 0.25s;"></div>
            </div>
          </div>
        </div>

      </div>

      <!-- 區塊 3：全螢幕 -->
      <div id="video-block-fullscreen" style="background:transparent; padding:0 1rem; height:3rem; display:flex; align-items:center;">
        <button id="video-fullscreen-btn" aria-label="全螢幕 Fullscreen" style="color:#fff; background:none; border:none; padding:0; line-height:1;">
          <span class="icon icon-full-screen icon-l"></span>
        </button>
      </div>

    </div>
  </div>
  </main>

  <!-- Footer -->
  <footer id="site-footer-static" class="snap-zone footer-shell relative overflow-hidden">
    <div class="footer-inner h-full flex flex-col md:flex-row">

      <!-- Logo：桌面靠左貼齊 padding，正方形吃滿可用高度 -->
      <div class="footer-logo-area">
        <div id="footer-logo" class="footer-logo-inner"></div>
      </div>

      <!-- 右側欄：桌面分上（隨機旋轉）下（privacy），手機線性堆疊 -->
      <div class="footer-right">

        <!-- 隨機分佈的旋轉項目
             DOM 順序＝手機直向視覺順序（social 貼 logo 下 → 電話 → 傳真 → email → 地址 → 學校卡）；
             桌面 scatter / 矮橫向 grid 都是顯式定位，不吃 DOM 順序 -->
        <div class="footer-random" data-fgroup="dept">

          <!-- Tab 與散佈項目 2026-08-11 起由 Directus 管理（footer_tabs / footer_items；CMS 掛掉 fallback
               /data/footer.json），js/modules/ui/footer-content.js 渲染進來：tab 按鈕進 .footer-tabs、
               項目（資訊卡/連結卡/社群 icon）接在後面。後台拖曳＝順序；第一個 tab＝預設顯示群組。 -->
          <div class="footer-tabs"></div>

        </div>

        <!-- Privacy / 法務連結：連結由 Directus footer_legal 渲染（footer-content.js renderLegal，插在 a11y 標章之前）；
             a11y 標章與 copyright 維持靜態。 -->
        <div class="footer-privacy">
          <div class="flex flex-col gap-xs items-start">
            <!-- 無障礙標章 placeholder（88×31，手機先行；正式標章拿到後換成 <a><img></a> 並開桌面） -->
            <div class="footer-a11y-badge" aria-hidden="true"></div>
            <p class="footer-copyright">Copyright © SCCD</p>
          </div>
        </div>

      </div>

    </div>
  </footer>

  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollToPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/Draggable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/InertiaPlugin.min.js"></script>
  <!-- Helper Functions - 必須在 main.js 之前載入 -->
  <script src="js/utils/helpers.js"></script>
  <script type="module" src="js/main-modular.js"></script>

</body>
</html>
